name: basic_flutter_app
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1  # 📌 Semantic Release actualizará esto automáticamente

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.9  
  google_fonts: ^6.2.1
  shared_preferences: ^2.2.2
  package_info_plus: ^4.2.0  # 📌 Agregado para obtener la versión de la app

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1  # 📌 Agregado para configurar el icono de la app

flutter:
  uses-material-design: true

  assets:
    - assets/images/ninja_sdet_logo.png

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/ninja_sdet_logo.png"  # 📌 Ruta de tu logo
